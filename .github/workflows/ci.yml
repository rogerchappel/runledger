name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Validate required project files
        run: |
          set -euo pipefail

          required_files=(
            README.md
            LICENSE
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

      - name: Validate markdown files are not empty
        run: |
          set -euo pipefail

          markdown_count=0

          while IFS= read -r -d '' file; do
            markdown_count=$((markdown_count + 1))
            test -s "$file"
          done < <(find . -type f -name '*.md' -not -path './.git/*' -print0)

          if [ "$markdown_count" -eq 0 ]; then
            echo "No markdown files found."
            exit 1
          fi

      - name: Run optional Node checks
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "No package.json found; skipping Node checks."
            exit 0
          fi

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm run lint --if-present
          npm run check --if-present
          npm test --if-present
          npm run typecheck --if-present
          npm run build --if-present

          if node -e 'process.exit(require("./package.json").bin?.runledger ? 0 : 1)'; then
            bin_target="$(node -e 'process.stdout.write(require("./package.json").bin.runledger)')"
            if [ ! -f "$bin_target" ]; then
              echo "Declared package binary target is missing: $bin_target"
              exit 1
            fi
          fi

          npm run smoke --if-present
          npm run package:smoke --if-present
          npm run release:workflow --if-present
