name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Run release checks
        run: npm run release:check
      - name: Pack package
        run: echo "TARFILE=$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            *.tgz
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 5

  npm-publish:
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
      - name: Publish package to npm
        run: npm publish ./*.tgz --provenance --access public

  github-release:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md ./*.tgz
